{{- if and .Values.adminBootstrapToken.autoGenerate (not .Values.adminBootstrapToken.secretRef.name) }}
{{- $secretName := include "k8s-driller.adminTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Preserve the existing token across upgrades instead of rotating it on every `helm upgrade` (lookup returns {} on `helm template`/dry-run, so a fresh value renders in those modes). */}}
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
{{- end }}
