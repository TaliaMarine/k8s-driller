{{- if .Values.networkPolicy.enabled }}
{{- /*
Best-effort default: allow egress to the API server (443/6443 covers most
distributions) and DNS, plus Prometheus/webhook targets when configured.
Cluster network layouts vary enough that this is a starting point to tighten
for your environment, not a guarantee.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-driller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-driller.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
