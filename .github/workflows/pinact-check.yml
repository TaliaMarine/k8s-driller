name: Pinned actions check

on:
  pull_request:
  push:
    branches: [main]

env:
  PINACT_VERSION: "4.1.1"

permissions:
  contents: read

jobs:
  pinact:
    name: Verify every action is pinned to a full commit SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinact
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          archive="pinact_linux_amd64.tar.gz"
          base_url="https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}"
          curl -sSLfO "$base_url/$archive"
          curl -sSLfO "$base_url/pinact_${PINACT_VERSION}_checksums.txt"
          grep " $archive\$" "pinact_${PINACT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$archive" pinact
          install pinact /usr/local/bin/pinact

      - name: Check action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check .github/workflows/*.yml
