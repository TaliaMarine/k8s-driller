name: Publish image

# Fires on a real release tag (created by release-please, see release-please.yml)
# so every published image corresponds to a real, versioned release — never an
# arbitrary main-branch commit. workflow_dispatch exists for two reasons: (1)
# release-please.yml chain-triggers it explicitly after creating a release,
# since the default GITHUB_TOKEN it uses cannot itself trigger a tag-push
# event; (2) it lets you manually (re-)publish an existing tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: version
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RAW_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "major_minor=$(cut -d. -f1,2 <<<"$version")"
            echo "major=$(cut -d. -f1 <<<"$version")"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.major_minor }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.major }}
            ${{ steps.version.outputs.image }}:latest
