{{- /*
Read-only guarantee (SPECS.md §4.2/§8.2): no verb below workload/node
resources is ever anything but get/list/watch. The only write verbs granted
anywhere in this file are scoped to the app's own driller.dev CRDs.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-driller.fullname" . }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["driller.dev"]
    resources: ["drilleruserroles", "drilleralertconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- if .Values.integrations.vpa.enabled }}
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-driller.fullname" . }}-secrets-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
rules:
  {{- /* Needed only to resolve DrillerAlertConfig webhook secretRefs (SPECS.md §5.2) — namespace-scoped, read-only. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
