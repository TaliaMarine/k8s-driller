{{- if and .Values.sessionSigningKey.autoGenerate (not .Values.sessionSigningKey.secretRef.name) }}
{{- $secretName := include "k8s-driller.sessionKeySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ if $existing }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
