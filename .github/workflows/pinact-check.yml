name: Pinned actions check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pinact:
    name: Verify every action is pinned to a full commit SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check action pins
        uses: suzuki-shunsuke/pinact-action@2a42f29b3397967439ed46e7650f3045f49699f9 # v3.0.1
        with:
          fix: "false"
          skip_push: "true"
