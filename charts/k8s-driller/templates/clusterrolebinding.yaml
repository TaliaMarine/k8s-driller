apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-driller.fullname" . }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-driller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-driller.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-driller.fullname" . }}-secrets-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-driller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-driller.fullname" . }}-secrets-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-driller.fullname" . }}
    namespace: {{ .Release.Namespace }}
