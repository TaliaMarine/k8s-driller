name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go test ./... -race

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/k8s-driller
      - name: Render every ingress mode
        run: |
          helm template charts/k8s-driller --set ingress.type=none
          helm template charts/k8s-driller --set ingress.type=nginx --set ingress.host=driller.example.com
          helm template charts/k8s-driller --set ingress.type=gateway-api --set ingress.host=driller.example.com --set ingress.gatewayApi.gatewayName=my-gw
      - name: Render optional integrations and Prometheus toggles
        run: |
          helm template charts/k8s-driller --set integrations.vpa.enabled=true --set integrations.opencost.enabled=true
          helm template charts/k8s-driller --set prometheus.enabled=true --set prometheus.baseUrl=http://prometheus.monitoring:9090
      - name: Enforce the read-only RBAC guarantee (SPECS.md §4.2/§8.2)
        run: |
          set -euo pipefail
          # drilleruserroles/drilleralertconfigs: the app's own CRDs, any verb allowed.
          # secrets: get always, create only as the one documented exception
          # (SPECS.md §4.2) — never update/patch/delete. Everything else: get/list/watch only.
          check_rbac() {
            local render="$1" allow_secrets_create="$2"
            local violation=0
            while IFS= read -r rule; do
              for resource in $(echo "$rule" | jq -r '.resources[]'); do
                case "$resource" in
                  drilleruserroles|drilleralertconfigs) continue ;;
                esac
                allowed_verbs="get list watch"
                if [ "$resource" = "secrets" ] && [ "$allow_secrets_create" = "true" ]; then
                  allowed_verbs="get create"
                elif [ "$resource" = "secrets" ]; then
                  allowed_verbs="get"
                fi
                for verb in $(echo "$rule" | jq -r '.verbs[]'); do
                  case " $allowed_verbs " in
                    *" $verb "*) ;;
                    *)
                      echo "::error::disallowed verb '$verb' on resource '$resource'"
                      violation=1
                      ;;
                  esac
                done
              done
            done < <(echo "$render" | yq -N 'select(.kind == "ClusterRole" or .kind == "Role") | .rules[]' -o json | jq -c '.')
            return "$violation"
          }

          default_render=$(helm template charts/k8s-driller --set integrations.vpa.enabled=true)
          optout_render=$(helm template charts/k8s-driller \
            --set sessionSigningKey.autoGenerate=false --set sessionSigningKey.secretRef.name=x \
            --set adminBootstrapToken.autoGenerate=false --set adminBootstrapToken.secretRef.name=y)

          violation=0
          check_rbac "$default_render" true || violation=1
          check_rbac "$optout_render" false || violation=1
          exit "$violation"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
